<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - StudioPRO</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/frontend/css/login_cliente.css">
</head>

<body>

    <div class="ambient-lights">
        <div class="orb orb-blue"></div>
        <div class="orb orb-gold"></div>
        <div class="orb orb-purple"></div>
    </div>

    <header>
        <a href="salao.html" class="back-btn"><i class="ph-bold ph-caret-left"></i></a>
        <div class="logo">STUDIOPRO</div>
        <div style="width: 40px;"></div>
    </header>

    <div class="auth-container">

        <div class="header-text" id="dynamic-header">
            <h1>Entrar</h1>
            <p>Acesse para gerenciar seus agendamentos</p>
        </div>

        <div class="tab-group">
            <div class="tab-btn active" onclick="switchTab('login')" id="tab-login">Entrar</div>
            <div class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Cadastrar</div>
        </div>

        <div id="form-login" class="form-box active">
            <form action="#">
                <div class="input-group">
                    <i class="ph-fill ph-envelope-simple"></i>
                    <input type="email" class="input-field" placeholder="Seu e-mail" required>
                </div>

                <div class="input-group">
                    <i class="ph-fill ph-lock-key"></i>
                    <input type="password" class="input-field" placeholder="Sua senha" required>
                </div>

                <a href="#" class="forgot-pass">Esqueceu a senha?</a>

                <button type="submit" class="btn-submit">Acessar Conta</button>
            </form>
        </div>

        <div id="form-signup" class="form-box">
            <form action="#">
                <div class="input-group">
                    <i class="ph-fill ph-user"></i>
                    <input type="text" class="input-field" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <i class="ph-fill ph-envelope-simple"></i>
                    <input type="email" class="input-field" placeholder="Seu e-mail" required>
                </div>

                <div class="input-group">
                    <i class="ph-fill ph-lock-key"></i>
                    <input type="password" class="input-field" placeholder="Crie uma senha" required minlength="6">
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 10px;">Criar minha conta</button>
            </form>
        </div>

    </div>

    <script src="/frontend/js/login_cliente.js"></script>
</body>

</html>
