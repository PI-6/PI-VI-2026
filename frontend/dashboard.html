<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Salão Belle</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/frontend/css/dashboard.css">
    <link rel="stylesheet" href="/frontend/css/painel.css">

</head>
<body>

    <div class="ambient-lights">
        <div class="orb orb-blue"></div>
        <div class="orb orb-gold"></div>
        <div class="orb orb-purple"></div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="ph-fill ph-scissors"></i></div>
            <div class="header-text">
                <h2>Salão Belle</h2>
                <p>Gestão</p>
            </div>
        </div>

        <ul class="sidebar-nav">
            <li>
                <a href="dashboard.html" class="active">
                    <i class="ph ph-squares-four"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="agenda.html">
                    <i class="ph ph-calendar-blank"></i>
                    <span class="nav-text">Agenda</span>
                </a>
            </li>
            <li>
                <a href="servicos.html">
                    <i class="ph ph-scissors"></i>
                    <span class="nav-text">Serviços</span>
                </a>
            </li>
            <li>
                <a href="profissionais.html">
                    <i class="ph ph-users"></i>
                    <span class="nav-text">Profissionais</span>
                </a>
            </li>
            <li>
                <a href="estoque.html">
                    <i class="ph ph-package"></i>
                    <span class="nav-text">Estoque</span>
                    <span class="nav-badge">3</span>
                </a>
            </li>
            <li>
                <a href="financeiro.html">
                    <i class="ph ph-chart-line-up"></i>
                    <span class="nav-text">Financeiro</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <p>User</p>
            </div>
            <a href="index.html" class="btn-logout"><i class="ph ph-sign-out"></i> Sair da conta</a>
        </div>
    </aside>

    <main class="main-content">
        
        <header class="page-header">
            <h1>Dashboard</h1>
            <p id="current-date">carregando...</p>
        </header>

        <section class="summary-grid">
            <div class="summary-card glass-panel">
                <div class="summary-title">Agendamentos Hoje</div>
                <div class="summary-value" id="val-agendamentos">—</div>
                <div class="summary-sub" id="sub-agendamentos">&nbsp;</div>
                <div class="summary-icon icon-blue"><i class="ph-fill ph-calendar-check"></i></div>
            </div>

            <div class="summary-card glass-panel">
                <div class="summary-title">Receita do Dia</div>
                <div class="summary-value" id="val-receita-dia">—</div>
                <div class="summary-sub" id="sub-receita-dia">&nbsp;</div>
                <div class="summary-icon icon-gold"><i class="ph-fill ph-currency-dollar"></i></div>
            </div>

            <div class="summary-card glass-panel">
                <div class="summary-title">Receita do Mês</div>
                <div class="summary-value" id="val-receita-mes">—</div>
                <div class="summary-sub" id="sub-receita-mes">&nbsp;</div>
                <div class="summary-icon icon-purple"><i class="ph-fill ph-trend-up"></i></div>
            </div>
        </section>

        <section class="section-box">
            <h2 class="section-title alert"><i class="ph-fill ph-warning"></i> Alerta de estoque</h2>

            <div class="glass-panel">
                <div class="alert-list" id="lista-estoque">
                    <div class="pn-estado">Carregando...</div>
                </div>
            </div>
        </section>

        <section class="section-box">
            <h2 class="section-title"><i class="ph-fill ph-clock"></i> Agenda de hoje</h2>

            <div class="glass-panel">
                <div class="alert-list" id="lista-agenda">
                    <div class="pn-estado">Carregando...</div>
                </div>
            </div>
        </section>

    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/painel.js"></script>
    <script src="/frontend/js/dashboard.js"></script>
</body>
</html>
