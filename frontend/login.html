<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioPRO | Acesso</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>
<body>

    <a href="index.html" class="back-home">&#8592; Voltar ao início</a>

    <div class="glass-container" id="container">
        
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Criar Conta</h1>
                <p class="subtitle">Registre seu Studio</p>
                <input type="text" placeholder="Nome completo" />
                <input type="email" placeholder="E-mail" />
                <input type="password" placeholder="Senha" />
                <button class="btn-primario">Cadastrar</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Entrar</h1>
                <p class="subtitle">Acesse seu Dashboard</p>
                <input type="email" placeholder="E-mail" />
                <input type="password" placeholder="Senha" />
                <a href="#" class="forgot-pass">Esqueceu sua senha?</a>
                <button class="btn-primario">Entrar</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                
                <div class="overlay-panel overlay-left">
                    <h2>Já tem uma conta?</h2>
                    <p>Faça login para acessar sua agenda e gerenciar seus clientes.</p>
                    <button class="btn-ghost" id="signIn">Fazer Login</button>
                </div>
                
                <div class="overlay-panel overlay-right">
                    <h2>Novo por aqui?</h2>
                    <p>Cadastre seu negócio e comece a automatizar sua rotina hoje mesmo.</p>
                    <button class="btn-ghost" id="signUp">Criar Conta</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });
    </script>
    <script src="/frontend/js/auth.js"></script>    
</body>
</html>
