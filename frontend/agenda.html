<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Salão Belle</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/frontend/css/agenda.css">
    <link rel="stylesheet" href="/frontend/css/painel.css">

    <style>

    </style>
</head>
<body>

    <div class="ambient-lights">
        <div class="orb orb-blue"></div>
        <div class="orb orb-gold"></div>
        <div class="orb orb-purple"></div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="ph-fill ph-scissors"></i></div>
            <div class="header-text">
                <h2>Salão Belle</h2>
                <p>Gestão</p>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html"><i class="ph ph-squares-four"></i><span class="nav-text">Dashboard</span></a></li>
            <li><a href="agenda.html" class="active"><i class="ph ph-calendar-blank"></i><span class="nav-text">Agenda</span></a></li>
            <li><a href="servicos.html"><i class="ph ph-scissors"></i><span class="nav-text">Serviços</span></a></li>
            <li><a href="profissionais.html"><i class="ph ph-users"></i><span class="nav-text">Profissionais</span></a></li>
            <li><a href="estoque.html"><i class="ph ph-package"></i><span class="nav-text">Estoque</span></a></li>
            <li><a href="financeiro.html"><i class="ph ph-chart-line-up"></i><span class="nav-text">Financeiro</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info"><div class="user-avatar">U</div><p>User</p></div>
            <a href="index.html" class="btn-logout"><i class="ph ph-sign-out"></i> Sair da conta</a>
        </div>
    </aside>

    <main class="main-content">
        
        <header class="page-header agenda-header">
            <div class="header-title">
                <h1>Agenda</h1>
                <p>Selecione um dia para visualizar os atendimentos agendados.</p>
            </div>
            <div class="agenda-actions">
                <select id="filtroProfissional" class="agenda-select" aria-label="Profissional">
                    <option value="">Todos os profissionais</option>
                </select>
                <button type="button" class="pn-btn pn-btn-ouro" id="btnBloquear">
                    <i class="ph-bold ph-lock-simple"></i> Bloquear horário
                </button>
            </div>
        </header>

        <div class="agenda-layout">

            <div class="calendar-widget glass-panel">
                <div class="cal-header">
                    <button type="button" class="cal-nav-btn" id="mesAnterior" aria-label="Mês anterior"><i class="ph-bold ph-caret-left"></i></button>
                    <h3 id="tituloMes">&nbsp;</h3>
                    <button type="button" class="cal-nav-btn" id="mesSeguinte" aria-label="Próximo mês"><i class="ph-bold ph-caret-right"></i></button>
                </div>

                <div class="cal-grid" id="calendario"></div>
                <button type="button" class="pn-btn cal-hoje" id="btnHoje">Hoje</button>
            </div>

            <div class="agenda-details">

                <div class="day-summary glass-panel">
                    <h2 id="display-date">&nbsp;</h2>
                    <p id="resumoDia">Carregando...</p>
                </div>

                <div class="appointments-list" id="listaDia"></div>

            </div>

        </div>
    </main>


    <div class="pn-overlay" id="modalBloqueio" hidden>
        <div class="pn-dialog pn-dialog-form" role="dialog" aria-modal="true" aria-labelledby="tituloBloqueio">
            <h3 id="tituloBloqueio">Bloquear horário</h3>
            <form id="formBloqueio" novalidate>
                <div class="pn-campo">
                    <label for="bloqProfissional">Profissional</label>
                    <select id="bloqProfissional" required></select>
                </div>

                <div class="pn-campo">
                    <label>Tipo</label>
                    <div class="pn-opcoes">
                        <label><input type="radio" name="tipo" value="pontual" checked> Só neste dia</label>
                        <label><input type="radio" name="tipo" value="semanal"> Toda semana</label>
                    </div>
                </div>

                <div class="pn-campo" data-tipo="pontual">
                    <label for="bloqData">Data</label>
                    <input type="date" id="bloqData">
                </div>

                <div class="pn-campo" data-tipo="semanal" hidden>
                    <label for="bloqDiaSemana">Dia da semana</label>
                    <select id="bloqDiaSemana">
                        <option value="0">Segunda-feira</option>
                        <option value="1">Terça-feira</option>
                        <option value="2">Quarta-feira</option>
                        <option value="3">Quinta-feira</option>
                        <option value="4">Sexta-feira</option>
                        <option value="5">Sábado</option>
                        <option value="6">Domingo</option>
                    </select>
                </div>

                <div class="pn-linha">
                    <div class="pn-campo">
                        <label for="bloqInicio">Início</label>
                        <input type="time" id="bloqInicio" step="1800" value="12:00" required>
                    </div>
                    <div class="pn-campo">
                        <label for="bloqFim">Fim</label>
                        <input type="time" id="bloqFim" step="1800" value="13:00" required>
                    </div>
                </div>

                <div class="pn-campo" data-tipo="semanal" hidden>
                    <label for="bloqValidoAte">Repetir até (opcional)</label>
                    <input type="date" id="bloqValidoAte">
                </div>

                <div class="pn-campo">
                    <label for="bloqMotivo">Motivo (opcional)</label>
                    <input type="text" id="bloqMotivo" maxlength="150" placeholder="Ex.: almoço, consulta médica">
                </div>

                <div class="modal-footer pn-dialog-acoes">
                    <button type="button" class="pn-btn" id="cancelarBloqueio">Cancelar</button>
                    <button type="submit" class="pn-btn pn-btn-ouro">Bloquear</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/painel.js"></script>
    <script src="/frontend/js/agenda.js"></script>
</body>
</html>
