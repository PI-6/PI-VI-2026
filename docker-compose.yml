# Desenvolvimento local: docker compose up -d
# Sobe o MySQL e o Mailpit (caixa de e-mail falsa: os e-mails da API aparecem em http://localhost:8025)
services:
  mysql:
    image: mysql:8.0
    container_name: salao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salao
      MYSQL_USER: salao
      MYSQL_PASSWORD: salao123
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: salao-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP que a API usa
      - "8025:8025"   # tela web para ler os e-mails

volumes:
  mysql_data:
